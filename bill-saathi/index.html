<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Saathi AI · Patient Workspace</title>
  
  <!-- Modern Inter Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THEME TOKENS
       ========================================================================== */
    :root {
      /* Colors */
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-light: #eff6ff;
      --blue-border: #bfdbfe;
      
      --teal: #0d9488;
      --teal-hover: #0f766e;
      --teal-light: #f0fdfa;
      --teal-border: #ccfbf1;
      
      --amber: #d97706;
      --amber-light: #fef3c7;
      --amber-border: #fde68a;
      
      --emerald: #059669;
      --emerald-light: #ecfdf5;
      --emerald-border: #a7f3d0;
      
      --red: #dc2626;
      --red-light: #fef2f2;
      --red-border: #fecaca;
      
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --line: #e2e8f0;
      --line-subtle: #f1f5f9;
      
      /* Elevation */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
      
      /* Radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 600;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--line-subtle);
      border-color: #cbd5e1;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
    }

    button.primary:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }

    button.teal {
      background: var(--teal);
      border-color: var(--teal);
      color: #ffffff;
    }

    button.teal:hover {
      background: var(--teal-hover);
    }

    button.ghost {
      border: none;
      background: transparent;
      color: var(--text-muted);
    }

    button.ghost:hover {
      background: var(--line-subtle);
      color: var(--text);
    }

    button.small {
      padding: 5px 9px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    button.danger {
      color: var(--red);
      border-color: #fca5a5;
    }

    button.danger:hover {
      background: var(--red-light);
    }

    .text-link {
      border: none;
      background: none;
      color: var(--blue);
      font-size: 12.5px;
      font-weight: 500;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .text-link:hover {
      background: transparent;
      color: var(--blue-hover);
      text-decoration: underline;
    }

    svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       SIDEBAR NAVIGATION
       ========================================================================== */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 250px;
      background: #ffffff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 24px 20px 20px;
    }

    .brand-mark {
      background: var(--teal);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(13, 148, 136, 0.2);
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    .brand-copy {
      font-size: 17px;
      font-weight: 750;
      color: var(--text);
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .brand small {
      display: block;
      letter-spacing: 1.6px;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--text-subtle);
      margin-top: 3px;
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-subtle);
      padding: 16px 20px 8px;
      text-transform: uppercase;
    }

    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .nav button {
      width: 100%;
      justify-content: flex-start;
      border: none;
      background: transparent;
      font-size: 12.5px;
      font-weight: 500;
      padding: 9px 12px;
      margin-bottom: 2px;
      color: #475569;
      border-radius: var(--radius-md);
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .nav button svg {
      width: 17px;
      height: 17px;
      color: #64748b;
    }

    .nav button:hover {
      background: var(--line-subtle);
      color: var(--text);
    }

    .nav button:hover svg {
      color: var(--text);
    }

    .nav button.active {
      color: var(--blue);
      background: var(--blue-light);
      font-weight: 600;
    }

    .nav button.active svg {
      color: var(--blue);
    }

    .nav .separate {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 14px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      border-radius: 50%;
      width: 36px;
      height: 36px;
      background: #e0f2fe;
      color: #0369a1;
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 750;
      flex-shrink: 0;
      border: 1px solid #bae6fd;
    }

    .profile-copy strong {
      font-size: 12.5px;
      display: block;
      color: var(--text);
      font-weight: 600;
    }

    .profile-copy small {
      font-size: 11px;
      color: var(--text-muted);
    }

    .collapse-btn {
      margin-top: 12px;
      width: 100%;
      font-size: 11.5px;
      padding: 7px 10px;
      color: var(--text-muted);
      border-color: var(--line);
    }

    .collapse-btn:hover {
      color: var(--text);
      background: var(--line-subtle);
    }

    /* Collapsed Sidebar State */
    .collapsed .sidebar {
      width: 70px;
    }

    .collapsed .shell {
      margin-left: 70px;
    }

    .collapsed .brand {
      padding: 20px 15px;
      justify-content: center;
    }

    .collapsed .brand-copy,
    .collapsed .nav-label,
    .collapsed .nav button span,
    .collapsed .profile .profile-copy,
    .collapsed .sidebar-footer .collapse-label {
      display: none;
    }

    .collapsed .nav button {
      justify-content: center;
      padding: 11px;
    }

    .collapsed .sidebar-footer {
      padding: 14px 10px;
    }

    .collapsed .profile {
      justify-content: center;
    }

    /* ==========================================================================
       TOP NAVIGATION BAR
       ========================================================================== */
    .shell {
      margin-left: 250px;
      transition: margin 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 32px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .crumb {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .crumb strong {
      display: block;
      color: var(--text);
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.3px;
      margin-bottom: 1px;
    }

    .top-search {
      margin-left: auto;
      position: relative;
      width: 280px;
    }

    .top-search input {
      padding-left: 36px;
      padding-right: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      font-size: 12px;
      width: 100%;
      height: 38px;
      color: var(--text);
      transition: all 0.15s ease;
    }

    .top-search input:focus {
      background: #ffffff;
      border-color: var(--blue);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .top-search svg {
      position: absolute;
      left: 11px;
      top: 10px;
      color: var(--text-subtle);
      width: 16px;
      height: 16px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      padding: 8px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }

    .icon-btn:hover {
      background: var(--line-subtle);
      color: var(--text);
    }

    .top-actions .avatar {
      cursor: pointer;
      width: 36px;
      height: 36px;
      border: none;
    }

    .top-actions .primary {
      font-size: 12.5px;
      padding: 8px 16px;
      height: 38px;
    }

    .mobile-toggle {
      display: none;
    }

    /* ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== */
    .main {
      flex: 1;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 32px 40px;
    }

    /* Demo Notice Banner */
    .demo-banner {
      background: #ecf6f5;
      border: 1px solid #d2eae5;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: #28695e;
      margin-bottom: 24px;
    }

    .demo-banner svg {
      color: var(--teal);
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .demo-banner strong {
      font-weight: 700;
      color: #1a4d45;
    }

    .demo-banner button {
      margin-left: auto;
      font-size: 11px;
      padding: 4px 12px;
      color: #28695e;
      background: #ffffff;
      border-color: #c6dfd9;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    .demo-banner button:hover {
      background: #f7fcfa;
      border-color: #a3cdc3;
    }

    /* Hero / Welcome Section */
    .welcome {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 1.5px;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .welcome h1, h1 {
      font-size: 28px;
      line-height: 1.25;
      margin: 2px 0 8px;
      letter-spacing: -0.6px;
      font-weight: 800;
      color: var(--text);
    }

    .welcome p {
      color: var(--text-muted);
      font-size: 13px;
      max-width: 580px;
      line-height: 1.6;
      margin: 0;
    }

    .welcome .actions {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
    }

    .welcome .actions button {
      font-size: 12.5px;
      padding: 9px 16px;
    }

    /* 4 Stat Cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .stat {
      padding: 20px 22px;
    }

    .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 550;
    }

    .icon-box {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: #eff4fd;
      color: var(--blue);
    }

    .icon-box.teal {
      background: #eef8f6;
      color: var(--teal);
    }

    .icon-box.amber {
      background: #fffaeb;
      color: var(--amber);
    }

    .stat-number {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.8px;
      margin: 12px 0 6px;
      color: var(--text);
    }

    .stat-foot {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-foot span {
      color: var(--teal);
      font-weight: 500;
    }

    /* Layout Grid */
    .grid-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 296px;
      gap: 20px;
      align-items: start;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card Header */
    .card-head {
      padding: 20px 22px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-head h2 {
      font-size: 15px;
      margin: 0 0 3px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .card-head p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Badges */
    .badge {
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 650;
      white-space: nowrap;
      background: var(--line-subtle);
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .badge.blue {
      color: var(--blue);
      background: var(--blue-light);
      border-color: var(--blue-border);
    }

    .badge.teal {
      color: #047857;
      background: var(--emerald-light);
      border-color: var(--emerald-border);
    }

    .badge.amber {
      color: #b45309;
      background: var(--amber-light);
      border-color: var(--amber-border);
    }

    .badge.red {
      color: var(--red);
      background: var(--red-light);
      border-color: var(--red-border);
    }

    .badge.gray {
      color: var(--text-muted);
      background: #f1f5f9;
      border-color: var(--line);
    }

    /* Case Strip inside Step Card */
    .case-strip {
      margin: 0 22px 20px;
      background: #f8fafc;
      border: 1px solid #edf0f4;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }

    .case-strip strong {
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
    }

    .case-strip small {
      font-size: 11px;
      display: block;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 7-Step Stepper */
    .steps {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 16px 20px;
    }

    .step {
      position: relative;
      text-align: center;
      font-size: 9.5px;
      color: #64748b;
      line-height: 1.4;
      font-weight: 500;
    }

    .step::before {
      content: '';
      height: 2px;
      background: #e2e8f0;
      position: absolute;
      left: -50%;
      right: 50%;
      top: 14px;
      z-index: 0;
    }

    .step:first-child::before {
      display: none;
    }

    .step.done::before, .step.current::before {
      background: #a5d7ce;
    }

    .step-dot {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 8px;
      background: #ffffff;
      font-weight: 650;
      font-size: 11px;
      color: var(--text-subtle);
    }

    .step-dot svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.2;
    }

    .step.done .step-dot {
      background: #e7f5f0;
      color: #059669;
      border-color: #a7f3d0;
    }

    .step.current .step-dot {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px #eff4ff;
    }

    .step.current {
      color: var(--blue);
      font-weight: 700;
    }

    /* Next Step Action Bar */
    .next-step {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f4f8ff;
      border-top: 1px solid #e9effa;
      padding: 13px 22px;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      font-size: 12px;
      color: #334e68;
    }

    .next-step svg {
      width: 18px;
      height: 18px;
      color: var(--blue);
      stroke-width: 2;
    }

    .next-step button {
      margin-left: auto;
      white-space: nowrap;
      font-size: 11.5px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
    }

    /* Table Tools & Table Styles */
    .table-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 16px;
    }

    .table-tools input {
      width: 100%;
      max-width: 300px;
      font-size: 12px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    .table-tools select {
      width: auto;
      font-size: 12px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--text);
    }

    .table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }

    th {
      color: var(--text-muted);
      background: #f8fafc;
      font-size: 10.5px;
      font-weight: 650;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text);
      vertical-align: middle;
    }

    tr:hover td {
      background: #fcfdfe;
    }

    td:first-child, th:first-child {
      padding-left: 22px;
    }

    td:last-child, th:last-child {
      padding-right: 22px;
    }

    td strong {
      font-size: 12.5px;
      font-weight: 650;
      color: var(--text);
    }

    td small {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 3px;
    }

    td.money {
      font-weight: 650;
      font-size: 13px;
      color: var(--text);
    }

    .table-footer {
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid #f1f5f9;
    }

    /* Right Column Widgets */
    .aside-card .card-head {
      padding: 18px 20px 14px;
    }

    .aside-card .card-head svg {
      color: var(--text-muted);
    }

    .aside-content {
      padding: 0 20px 18px;
    }

    .alert-item {
      border: 1px solid #edf0f4;
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    .alert-item:hover {
      border-color: #cbd5e1;
    }

    .alert-item:last-child {
      margin-bottom: 0;
    }

    .alert-item svg {
      width: 18px;
      height: 18px;
      color: var(--amber);
      margin-top: 1px;
    }

    .alert-item strong {
      font-size: 12.5px;
      display: block;
      color: var(--text);
      font-weight: 650;
    }

    .alert-item p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 4px 0 8px;
    }

    .activity {
      display: flex;
      gap: 12px;
      padding-bottom: 18px;
      position: relative;
    }

    .activity:last-child {
      padding-bottom: 4px;
    }

    .activity .activity-icon {
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    .activity svg {
      width: 14px;
      height: 14px;
    }

    .activity:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 14px;
      top: 28px;
      bottom: 0;
      width: 1px;
      background: #e2e8f0;
    }

    .activity strong {
      font-size: 12px;
      display: block;
      font-weight: 600;
      color: var(--text);
    }

    .activity small {
      display: block;
      font-size: 10.5px;
      color: var(--text-subtle);
      margin-top: 3px;
    }

    .tip {
      padding: 20px;
      background: #eff7f7;
      border-color: #dfeeed;
    }

    .tip h3 {
      font-size: 13px;
      margin: 0 0 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--text);
      font-weight: 700;
    }

    .tip h3 svg {
      color: var(--teal);
    }

    .tip p {
      font-size: 11.5px;
      color: #476867;
      line-height: 1.6;
      margin: 0 0 12px;
    }

    /* Page Footer */
    .privacy-footer {
      font-size: 11px;
      color: var(--text-subtle);
      text-align: center;
      margin: 28px 0 10px;
      font-weight: 500;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      gap: 12px;
    }

    .footer span {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .footer svg {
      width: 14px;
      height: 14px;
    }

    /* Form Controls */
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      color: var(--text);
      background: #ffffff;
      max-width: 100%;
      width: 100%;
      transition: all 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    label.check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 450;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }

    label.check:hover {
      background: var(--line-subtle);
    }

    input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .padded {
      padding: 24px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-heading h1 {
      font-size: 24px;
      margin: 0 0 4px;
    }

    .page-heading p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .muted {
      color: var(--text-muted);
    }

    .notice {
      padding: 12px 16px;
      border: 1px solid #dde8f6;
      background: #f2f7ff;
      border-radius: var(--radius-md);
      font-size: 12px;
      color: #3b597e;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .notice.warning {
      background: #fff9ed;
      border-color: #f3e4c6;
      color: #926620;
    }

    .notice svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty svg {
      width: 36px;
      height: 36px;
      color: var(--text-subtle);
      margin-bottom: 12px;
    }

    .empty h3 {
      color: var(--text);
      font-size: 15px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .empty p {
      font-size: 12px;
      max-width: 420px;
      margin: 0 auto 18px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Document Dropzone */
    .dropzone {
      border: 2px dashed #cbd9ec;
      border-radius: var(--radius-lg);
      background: #f8fbff;
      text-align: center;
      padding: 36px 20px;
      transition: all 0.15s ease;
    }

    .dropzone.drag {
      border-color: var(--blue);
      background: #eff6ff;
    }

    .dropzone > svg {
      width: 40px;
      height: 40px;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .dropzone h3 {
      margin: 8px 0 4px;
      font-size: 15px;
      font-weight: 700;
    }

    .dropzone p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin: 0 0 16px;
    }

    .document {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .document .details {
      flex: 1;
      min-width: 140px;
    }

    .document strong {
      display: block;
      font-size: 12.5px;
      word-break: break-word;
    }

    .document small {
      font-size: 11px;
      color: var(--text-muted);
    }

    .document select {
      width: auto;
      max-width: 170px;
      font-size: 11px;
      padding: 5px 8px;
    }

    .document svg {
      color: #4a78ab;
    }

    .doc-preview {
      min-height: 500px;
      background: #eef1f5;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow: auto;
    }

    .paper {
      background: #ffffff;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
      color: #334155;
      border-radius: 4px;
    }

    .paper h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .paper table {
      white-space: normal;
      margin: 14px 0;
    }

    .paper td {
      padding: 8px 4px;
    }

    .extracted-field {
      margin-bottom: 14px;
    }

    .extracted-field small {
      font-size: 10.5px;
      color: var(--text-muted);
      display: block;
      margin-top: 3px;
    }

    .progressbar {
      height: 6px;
      border-radius: var(--radius-full);
      background: #eaf0f6;
      overflow: hidden;
      margin-top: 10px;
    }

    .progressbar i {
      display: block;
      background: var(--teal);
      height: 100%;
      border-radius: var(--radius-full);
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .case-grid h3 {
      font-size: 14px;
      margin: 12px 0 6px;
      font-weight: 700;
    }

    .case-grid .actions {
      margin-top: 18px;
    }

    .draft {
      min-height: 400px;
      font-size: 13px;
      line-height: 1.8;
      font-family: Georgia, serif;
      padding: 16px;
    }

    .help-steps {
      counter-reset: step;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .help-steps div {
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
    }

    .help-steps div::before {
      counter-increment: step;
      content: counter(step, decimal-leading-zero);
      display: block;
      color: var(--teal);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    details {
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
    }

    summary {
      cursor: pointer;
      font-weight: 650;
      font-size: 13px;
      color: var(--text);
    }

    details p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.6;
    }

    /* Dialog Modal */
    dialog {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 560px;
      width: calc(100% - 32px);
      box-shadow: var(--shadow-lg);
      color: var(--text);
      background: #ffffff;
      margin: auto;
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
    }

    dialog h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    dialog p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    dialog .actions {
      justify-content: flex-end;
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      max-width: 400px;
      background: var(--navy);
      color: #ffffff;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 100;
      font-size: 12.5px;
      font-weight: 500;
      animation: toast-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes toast-in {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .space {
      height: 20px;
    }

    .error {
      color: var(--red);
      font-size: 11.5px;
      margin-top: 6px;
    }

    .inline-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .overlay {
      display: none;
    }

    .wizard-top {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .wizard-top span {
      font-size: 12px;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .wizard-top .active {
      color: var(--blue);
      font-weight: 700;
    }

    .wizard-top .complete {
      color: var(--teal);
      font-weight: 600;
    }

    .source-pill {
      font-size: 10px;
      background: #f0f4fa;
      border-radius: 4px;
      padding: 2px 6px;
      display: inline-block;
      color: #657790;
      font-weight: 500;
    }

    .item-note {
      white-space: normal;
      max-width: 300px;
      min-width: 150px;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .report-grid h3 {
      font-size: 14px;
      font-weight: 700;
      margin: 10px 0 4px;
    }

    .report-grid p {
      font-size: 11.5px;
      min-height: 46px;
    }

    .audit-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .audit-mini .card {
      padding: 16px;
    }

    .audit-mini strong {
      font-size: 22px;
      display: block;
      margin: 6px 0 2px;
      font-weight: 750;
    }

    .audit-mini small {
      font-size: 11px;
      color: var(--text-muted);
    }

    .note-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-selector {
      width: auto;
      max-width: 340px;
      font-size: 12px;
      padding: 6px 10px;
    }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS
       ========================================================================== */
    @media (min-width: 1450px) {
      .main {
        padding: 30px 40px;
      }
      .grid-main {
        grid-template-columns: minmax(0, 1fr) 310px;
      }
      .welcome h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 1200px) {
      .sidebar {
        width: 220px;
      }
      .shell {
        margin-left: 220px;
      }
      .main {
        padding: 20px;
      }
      .topbar {
        padding: 0 20px;
      }
      .grid-main {
        grid-template-columns: minmax(0, 1fr) 260px;
      }
      .top-search {
        width: 220px;
      }
      .case-grid, .report-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 1000px) {
      .sidebar {
        width: 200px;
      }
      .shell {
        margin-left: 200px;
      }
      .grid-main {
        grid-template-columns: 1fr;
      }
      .grid-main > .stack:last-child {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .tip {
        grid-column: 1 / -1;
      }
      .top-search {
        display: none;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .welcome {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .two-col {
        grid-template-columns: 1fr;
      }
      .help-steps {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .sidebar, .collapsed .sidebar {
        width: 260px;
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .shell, .collapsed .shell {
        margin-left: 0;
      }
      .mobile-toggle {
        display: inline-flex;
      }
      .mobile-open .sidebar {
        transform: translateX(0);
      }
      .mobile-open .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(2px);
        z-index: 29;
      }
      .topbar {
        height: 64px;
        padding: 0 16px;
        gap: 10px;
      }
      .top-actions .help-top, .top-actions .avatar {
        display: none;
      }
      .top-actions .primary {
        padding: 6px 10px;
        font-size: 11px;
        height: 34px;
      }
      .main {
        padding: 16px;
      }
      .demo-banner {
        font-size: 11px;
        margin-bottom: 18px;
        flex-direction: column;
        align-items: flex-start;
      }
      .demo-banner button {
        margin-left: 0;
      }
      .welcome h1 {
        font-size: 24px;
      }
      .stats {
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat {
        padding: 16px;
      }
      .stat-number {
        font-size: 26px;
      }
      .grid-main > .stack:last-child {
        display: flex;
      }
      .steps {
        padding: 0 6px 16px;
      }
      .step {
        font-size: 8px;
      }
      .step-dot {
        width: 24px;
        height: 24px;
      }
      .step::before {
        top: 12px;
      }
      .next-step {
        padding: 12px;
        flex-wrap: wrap;
      }
      .case-strip {
        margin: 0 14px 16px;
      }
      .table-tools {
        padding: 0 14px 14px;
        flex-wrap: wrap;
      }
      .table-tools input {
        max-width: none;
      }
      .footer {
        flex-direction: column;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-grid .wide {
        grid-column: auto;
      }
      .padded {
        padding: 16px;
      }
      .page-heading {
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .case-grid, .report-grid {
        grid-template-columns: 1fr;
      }
      .audit-mini {
        grid-template-columns: repeat(2, 1fr);
      }
      .toast {
        right: 16px;
        left: 16px;
        bottom: 16px;
        max-width: none;
      }
    }

    @media print {
      .sidebar, .topbar, .demo-banner, .footer, button, .toast {
        display: none !important;
      }
      .shell {
        margin: 0;
      }
      .main {
        padding: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
      .draft {
        border: none;
        height: auto;
      }
      .notice {
        background: #ffffff;
      }
    }
  </style>
</head>

              ${btn(icon('grid'), "caseView='grid';updateCases()", 'small')}
            </div>
          </div>
          <div class="table-tools">
            <input id="case-search" aria-label="Search cases" placeholder="Search case name, ID or hospital…" oninput="search=this.value;page=1;updateCases()">
            <select aria-label="Filter by case stage" onchange="filter=this.value;page=1;updateCases()">
              <option value="all">All statuses</option>
              ${['Draft', 'Awaiting Documents', 'Processing', 'Needs Review', 'Audit Completed', 'Draft Prepared', 'Ready for Export'].map(x => `<option>${x}</option>`).join('')}

    function updateCases() {
      let list = filteredCases(), n = 5, start = (page - 1) * n, shown = list.slice(start, start + n);
      document.getElementById('cases-result').innerHTML = (
        caseView === 'table' ? caseTable(shown) : `
          <div class="case-grid padded">
            ${shown.map(c => `
              <div class="card padded">
                ${badge(c.stage)}
                <h3>${esc(c.name)}</h3>
                <p class="muted">${esc(c.id)} · ${esc(c.hospital)}</p>
                <strong>${money(c.amount)}</strong>
                <div class="progressbar"><i style="width:${(c.progress / 7) * 100}%"></i></div>
                <p class="muted">${c.progress} of 7 stages ${demo ? '· Demo Data' : ''}</p>
                <div class="actions">
                  ${btn('Open case', `go('detail','${c.id}')`, 'primary')}
                  ${btn('Delete', `deleteCase('${c.id}')`, 'danger')}
                </div>
              </div>
            `).join('') || empty('No matching cases', 'Adjust your search or status filter.')}
          </div>
        `
      ) + `
        <div class="table-footer">
          <span>${list.length ? start + 1 : 0}–${Math.min(start + n, list.length)} of ${list.length} cases</span>
          <div class="row">
            <button ${page <= 1 ? 'disabled' : ''} onclick="page--;updateCases()">Previous</button>
            <span>Page ${page}</span>
            <button ${start + n >= list.length ? 'disabled' : ''} onclick="page++;updateCases()">Next</button>
          </div>
        </div>
      `;

      document.querySelectorAll('button').forEach(b => {
        if (!b.textContent.trim() && b.innerHTML.includes('svg')) {
          b.setAttribute('aria-label', b.getAttribute('onclick')?.includes('deleteCase') ? 'Delete case' : b.getAttribute('onclick')?.includes('grid') ? 'Grid view' : 'Table view');
        }
      });
    }

    function deleteCase(id) {
      modal('Delete this case?', `
        <p>This removes the case and its documents from this ${demo ? 'demo' : 'local'} session. It does not delete anything from a server.</p>
      `, btn('Delete case', `confirmDelete('${id}')`, 'danger'));
    }

    function confirmDelete(id) {
      state().docs.filter(d => d.caseId === id).forEach(d => {
        if (docUrls.has(d.id)) {
          URL.revokeObjectURL(docUrls.get(d.id));
          docUrls.delete(d.id);
        }
      });
      state().cases = state().cases.filter(c => c.id !== id);
      state().docs = state().docs.filter(d => d.caseId !== id);
      state().findings = state().findings.filter(f => f.caseId !== id);
      document.getElementById('dialog').close();
      go('cases');
      toast('Case removed from this browser session.');
    }

       CASE DETAIL VIEW

        <div>
          <label for="f-${key}">${label}${required ? ' *' : ''}</label>
          <input id="f-${key}" name="${key}" type="${type}" ${required ? 'required' : ''} ${type === 'number' ? 'min="0" step="0.01"' : ''} value="${esc(wizard[key] || '')}">
        </div>
      `;
    }

    function newPage() {
      let edit = !!wizard.id;
      return `
        ${heading(edit ? 'Edit your case' : 'Start a new bill review', 'A few details will help keep your documents and review organized.')}
        <div class="card padded" style="max-width:900px">
          <div class="wizard-top">
            ${['Case information', 'Review objectives', 'Review & create'].map((s, i) => `
              <span class="${wizardStep === i + 1 ? 'active' : wizardStep > i + 1 ? 'complete' : ''}">${i + 1}. ${s}</span>
            `).join('')}
          </div>
          <form id="wizard-form">
            ${wizardStep === 1 ? `
              <div class="form-grid">
                ${field('Case name', 'name', 'text', true)}
                ${field('Hospital or healthcare provider', 'hospital', 'text', true)}
                ${field('Hospital city', 'city')}
                ${field('Total bill amount', 'amount', 'number', true)}
                ${field('Admission date', 'admission', 'date')}
                ${field('Discharge date', 'discharge', 'date')}

                </div>
                <div class="wide">
                  <label for="description">What would you like to understand?</label>
                  <textarea name="description" id="description" placeholder="Describe the bill or the concern in your own words.">${esc(wizard.description || '')}</textarea>

              </div>
            ` : wizardStep === 2 ? `
              <h3 style="font-size:15px;margin-bottom:6px">What would you like to review?</h3>

              ${objectiveOptions.map(v => `
                <label class="check">
                  <input type="checkbox" name="objectives" value="${esc(v)}" ${(wizard.objectives || []).includes(v) ? 'checked' : ''}>

              <h3 style="font-size:15px;margin-bottom:6px">Check your case details</h3>
              <div class="notice">
                ${demo ? 'This case will be added to the separate demo session. Use fictional details only.' : 'This case stays only in this tab. Refreshing or closing it will clear the workspace.'}
              </div>
              <div class="form-grid">
                ${[
                  ['Case name', wizard.name],
                  ['Provider', wizard.hospital],
                  ['City', wizard.city],
                  ['Bill amount', money(wizard.amount)],
                  ['Bill date', date(wizard.date)],
                  ['Insurance', wizard.insurance]

                  <div>
                    <label>${k}</label>
                    <span style="font-weight:600">${esc(v || 'Not provided')}</span>
                  </div>
                `).join('')}
                <div class="wide">
                  <label>Review objectives</label>
                  ${(wizard.objectives || []).map(v => `<p class="note-text">${icon('check')} ${esc(v)}</p>`).join('')}

                ${wizardStep < 3 ? 'Continue' : edit ? 'Save case locally' : 'Create case locally'} ${icon('arrow')}
              </button>
            </div>
          </form>
          <p class="inline-note">No backend is connected. Progress is retained only while this tab remains open.</p>
        </div>
      `;
    }

    function bindWizard() {
      document.getElementById('wizard-form').onsubmit = e => {
        e.preventDefault();
        let data = new FormData(e.target);
        if (wizardStep === 1) {
          Object.assign(wizard, Object.fromEntries(data));
          wizard.amount = Number(wizard.amount);
          if (wizard.admission && wizard.discharge && wizard.discharge < wizard.admission) {
            document.getElementById('wizard-error').textContent = 'Discharge date must not be before admission date.';
            return;
          }
          wizardStep = 2;
          render();
        } else if (wizardStep === 2) {
          wizard.objectives = data.getAll('objectives');
          if (!wizard.objectives.length) {
            document.getElementById('wizard-error').textContent = 'Select at least one review objective.';
            return;
          }
          wizardStep = 3;
          render();
        } else {
          let edit = !!wizard.id;
          let id = wizard.id || 'LOCAL-' + Date.now().toString().slice(-6);
          let c = {
            ...wizard,
            id,
            updated: new Date().toISOString().slice(0, 10),
            stage: wizard.stage || 'Awaiting Documents',
            progress: wizard.progress || 1
          };
          if (edit) state().cases = state().cases.map(x => x.id === id ? c : x);
          else state().cases.unshift(c);
          activeId = id;
          addActivity(edit ? 'Case details updated locally' : 'Case created locally');
          wizard = {};
          wizardStep = 1;
          go('detail', id);
          toast('Case saved in this tab. No server request was made.');
        }
      };
    }

    function needCase() {
      return empty('Create a case first', 'Documents, findings and drafts need a case to stay organized.', "wizard={};wizardStep=1;go('new')", 'Create a case');
    }

    /* ==========================================================================
       DOCUMENT UPLOAD VIEW
       ========================================================================== */
    function uploadPage() {
      if (!current()) return needCase();
      return `
        ${heading('Your document center', 'Bring the bill and supporting records together.', selector())}
        <div class="notice">
          ${icon('lock')}
          <span>Select documents only if you are authorized to use them. In this prototype, files remain in memory in this tab and are not uploaded to a server.</span>
        </div>
        <div class="two-col">
          <section class="card padded">
            <div class="dropzone" id="dropzone">
              ${icon('upload')}
              <h3>Drop your documents here</h3>
              <p>PDF, JPG or PNG · Up to 10 MB per file</p>
              <input type="file" id="file-input" accept="application/pdf,image/jpeg,image/png" multiple hidden onchange="selectFiles(this.files);this.value=''">
              ${btn('Browse files', "document.getElementById('file-input').click()", 'primary', 'plus')}
              <p style="margin-top:12px;margin-bottom:0">Files are selected locally, not sent to a server.</p>
            </div>
            <div id="pending-files">${pendingHtml()}</div>

          </section>
          <section class="card padded">
            <h3 style="margin-top:0;font-size:15px;font-weight:700">Case documents <span class="badge gray">${docs().length}</span></h3>
            ${docs().length ? docs().map(documentRow).join('') : empty('No documents yet', 'Select a bill and any supporting records to begin.')}
            <p class="inline-note">Sample documents are generated illustrations, not actual uploaded patient files.</p>
          </section>
        </div>
      `;
    }

    function pendingHtml() {
      return pending.map((p, i) => `
        <div class="document">
          ${icon(p.error ? 'warning' : 'file')}
          <div class="details">
            <strong>${esc(p.file.name)}</strong>
            <small>${(p.file.size / 1024 / 1024).toFixed(2)} MB · ${p.error ? `<span class="error">${esc(p.error)}</span>` : 'Selected locally'}</small>
          </div>
          ${!p.error ? `
            <select aria-label="Category for ${esc(p.file.name)}" onchange="pending[${i}].category=this.value">
              ${categories.map(c => `<option ${p.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          ` : ''}
          ${btn('Remove', `pending.splice(${i},1);refreshPending()`, 'small')}
        </div>
      `).join('');
    }

    function refreshPending() {
      document.getElementById('pending-files').innerHTML = pendingHtml();
    }

    function selectFiles(files) {
      for (let f of files) {
        let error = !['application/pdf', 'image/jpeg', 'image/png'].includes(f.type) ? 'Unsupported file type' :
                    f.size > 10 * 1024 * 1024 ? 'File exceeds 10 MB' :
                    f.size === 0 ? 'File is empty' : '';
        pending.push({ file: f, error, category: categories[0] });
      }
      refreshPending();
    }

    function wireDrop() {
      let z = document.getElementById('dropzone');
      z.ondragover = e => { e.preventDefault(); z.classList.add('drag'); };
      z.ondragleave = () => z.classList.remove('drag');
      z.ondrop = e => { e.preventDefault(); z.classList.remove('drag'); selectFiles(e.dataTransfer.files); };
    }

    function commitFiles() {
      let valid = pending.filter(p => !p.error);
      if (!valid.length) {
        toast('Choose at least one valid PDF, JPG or PNG first.');
        return;
      }
      for (let p of valid) {
        let id = 'DOC-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6);
        state().docs.push({
          id,
          caseId: current().id,
          name: p.file.name,
          category: p.category,
          status: 'Selected locally',
          size: p.file.size,
          type: p.file.type,
          sample: false
        });
        docUrls.set(id, URL.createObjectURL(p.file));
      }
      pending = pending.filter(p => p.error);
      addActivity(`${valid.length} document(s) selected locally`);
      render();
      toast('Files added to this tab only. Server upload and OCR are unavailable.');
    }

    function documentRow(d) {
      return `
        <div class="document">
          ${icon('file')}
          <div class="details">
            <strong>${esc(d.name)}</strong>
            <small>${esc(d.category)} · ${d.sample ? 'Demo Data' : (d.size / 1024).toFixed(0) + ' KB'}</small>
            <div style="margin-top:5px">${badge(d.status)}</div>
          </div>
          ${btn('Preview', `previewDoc('${d.id}')`, 'small', 'eye')}
          ${btn('Review', `reviewDoc('${d.id}')`, 'small')}
        </div>
      `;
    }

    let selectedDoc;
    function reviewDoc(id) {
      selectedDoc = id;
      go('review');
    }

    function samplePaper(d) {
      let bill = d.category.includes('invoices');
      return `
        <div class="paper">
          <div class="eyebrow">SYNTHETIC DOCUMENT · DEMO DATA</div>
          <h3>${esc(current()?.hospital || 'Sample provider')}</h3>
          <p style="font-size:11px;color:var(--text-muted);margin:8px 0 14px">
            ${bill ? 'ITEMIZED HOSPITAL BILL' : 'SUPPORTING DOCUMENT'}<br>
            Sample patient · ${esc(current()?.id)}<br>
            Invoice: SAMPLE-2026-01<br>
            Bill date: ${date(current()?.date)}
          </p>
          <hr style="border:0;border-top:1px solid #dce2ea;margin-bottom:14px">
          ${bill && current()?.id !== 'BS-1024' ? `
            <p class="note-text">Sample discharge invoice total: ${money(current()?.amount)}. Detailed line items are not supplied in this illustration.</p>
          ` : bill ? `
            <table>
              <tbody>
                ${[
                  ['Room & nursing', 30000],
                  ['Procedure & services', 42000],
                  ['CBC panel', 2500],
                  ['CBC panel', 2500],
                  ['Medicines & supplies', 7000]
                ].map(([l, a]) => `<tr><td>${l}</td><td style="font-weight:600">${money(a)}</td></tr>`).join('')}
                <tr style="border-top:2px solid #e2e8f0">
                  <td><strong>Line-item total</strong></td>
                  <td><strong>₹84,000</strong></td>
                </tr>
                <tr>
                  <td><strong>Billed total</strong></td>
                  <td><strong>₹84,500</strong></td>
                </tr>
              </tbody>
            </table>
          ` : '<p class="note-text">This fictional supporting document is a preview placeholder. No clinical narrative or patient identity is provided.</p>'}
          <p style="font-size:9.5px;color:#94a3b8;margin-top:30px">
            Page 1 · Generated illustration, not an actual patient record.<br>Amounts are synthetic and do not represent official rates.
          </p>
        </div>
      `;
    }

    function previewDoc(id) {
      let d = state().docs.find(d => d.id === id);
      if (!d) return;
      modal(d.name, `<div class="doc-preview" style="min-height:300px">${documentPreview(d)}</div>`);
    }

    function documentPreview(d) {
      if (d.sample) return samplePaper(d);
      let u = docUrls.get(d.id);
      if (!u) return '<p>Preview unavailable in this session. Select the file again.</p>';
      return d.type === 'application/pdf' ?
        `<iframe title="Document preview" src="${u}" style="border:0;width:100%;height:520px"></iframe>` :
        `<img src="${u}" alt="Selected document preview" style="max-width:100%;height:auto">`;
    }

    /* ==========================================================================
       DOCUMENT REVIEW VIEW
       ========================================================================== */
    function reviewPage() {
      if (!current()) return needCase();
      let ds = docs(), d = ds.find(x => x.id === selectedDoc) || ds[0];
      if (!d) return heading('Document review', 'Confirm source details before using them in an audit.', selector()) + empty('No documents to review', 'Add a bill to this case first.', "go('upload')", 'Add documents');
      selectedDoc = d.id;
      let values = ocrEdits[d.id] || { hospital: current().hospital, invoice: 'SAMPLE-2026-01', date: current().date, total: current().amount, patient: 'Sample patient' };
      return `
        ${heading('Review the source, then the details', 'Keep AI-extracted values separate from user-confirmed information.', selector())}
        <div class="notice ${d.sample ? '' : 'warning'}">
          ${icon(d.sample ? 'info' : 'warning')}
          <span>${d.sample ? 'Illustrative extracted fields · No OCR engine was run. Confidence scores are unavailable.' : 'OCR unavailable — no extraction service is connected. Enter values manually and check the source. No confidence score is available.'}</span>
        </div>
        <div class="row" style="margin-bottom:18px">
          <label class="sr-only" for="doc-select">Select document</label>
          <select id="doc-select" class="page-selector" onchange="selectedDoc=this.value;render()">
            ${ds.map(x => `<option value="${x.id}" ${d.id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
          </select>
          ${badge(d.status)}
        </div>
        <div class="two-col">
          <section class="card padded">
            <div class="row" style="justify-content:space-between;margin-bottom:14px">
              <strong>Source document</strong>
              <span class="source-pill">${d.sample ? 'Page 1' : 'Original file'}</span>
            </div>
            <div class="doc-preview">${documentPreview(d)}</div>
          </section>
          <section class="card padded">
            <h3 style="margin:0 0 4px;font-size:15px;font-weight:700">${d.sample ? 'Illustrative extracted information' : 'Manual information entry'}</h3>
            <p class="note-text" style="margin-bottom:16px">${d.confirmed ? 'User-confirmed values.' : 'Unconfirmed — inspect the original document before confirming.'}</p>
            <form id="ocr-form" onsubmit="event.preventDefault();saveOCR(false)">
              ${[
                ['Patient name', 'patient', 'text'],
                ['Hospital name', 'hospital', 'text'],
                ['Invoice number', 'invoice', 'text'],
                ['Bill date', 'date', 'date'],
                ['Final total (INR)', 'total', 'number']
              ].map(([l, k, t]) => `
                <div class="extracted-field">
                  <label for="ocr-${k}">${l}</label>
                  <input id="ocr-${k}" name="${k}" type="${t}" ${t === 'number' ? 'min="0" step="0.01"' : ''} value="${esc((d.sample || ocrEdits[d.id]) ? values[k] : '')}">
                  <small>${d.sample ? 'Sample source: page 1' : 'Source page not supplied · manually entered'} · ${d.confirmed ? 'User confirmed' : 'Not confirmed'}</small>
                </div>
              `).join('')}
              <div class="actions" style="margin-top:20px">
                <button class="primary" type="submit">Save Changes</button>
                ${btn('Mark as Reviewed', 'saveOCR(true)')}
                ${btn('Reprocess Document', "unavailable('OCR reprocessing','POST /api/documents/:id/reprocess')")}
                ${btn('Continue to Bill Audit', "go('audit')", '', 'arrow')}
              </div>
            </form>
            <p class="inline-note">Edits are stored in memory only. No invented confidence percentages are shown. A local review does not run an audit.</p>
          </section>
        </div>
      `;
    }

    function saveOCR(confirm) {
      let form = document.getElementById('ocr-form');
      if (!form.reportValidity()) return;
      let data = Object.fromEntries(new FormData(form));
      if (confirm && Object.values(data).some(v => !v.trim())) {
        toast('Complete each field, or save changes without marking it reviewed.');
        return;
      }
      ocrEdits[selectedDoc] = data;
      let d = state().docs.find(d => d.id === selectedDoc);
      if (confirm) {
        d.status = 'Reviewed locally';
        d.confirmed = true;
        addActivity('Document details reviewed locally');
      }
      render();
      toast(confirm ? 'Document marked reviewed in this tab.' : 'Changes saved in this tab.');
    }

    function unavailable(feature, endpoint) {
      modal(feature + ' is not connected', `
        <p>This frontend has no connected backend for ${esc(feature.toLowerCase())}. Nothing has been submitted or processed.</p>
        <div class="notice">
          <strong>Proposed integration point</strong><br>
          <code>${esc(endpoint)}</code>
        </div>
        <p class="note-text">These are proposed API contracts, not existing endpoints. See the included integration guide.</p>
      `);
    }

    /* ==========================================================================
       BILL AUDIT VIEW
       ========================================================================== */
    function auditPage() {
      if (!current()) return needCase();
      let fs = findings(), amount = current().amount;
      let filtered = fs.filter(f => auditFilter === 'all' || f.type === auditFilter || (auditFilter === 'unresolved' && f.status !== 'Resolved by User'));
      return `

    function downloadDoc(id) {

        return;
      }
      let u = docUrls.get(id);
      if (u) {
        let a = document.createElement('a');
        a.href = u;
        a.download = d.name;
        a.click();
      } else {
        toast('Original file is unavailable. Select it again.');

    /* ==========================================================================

    function draftKey(type) {
      return `${demo ? 'demo' : 'local'}:${current()?.id}:${type}`;
    }

    function draftPage(type) {
      if (!current()) return needCase();
      let aff = type === 'affidavit';
      let title = aff ? 'Affidavit draft assistant' : 'Complaint assistant';
      let key = draftKey(type);
      let model = drafts[key] || { step: 1, selected: [], text: '' };
      drafts[key] = model;

      return `
        ${heading(title, 'Build a factual draft. Keep control of every word.', selector())}
        <div class="notice warning">
          ${icon('warning')}
          <span>${aff ? 'This is an AI-assisted draft, not a sworn or legally validated affidavit. Review it carefully and obtain appropriate legal guidance about execution, attestation, or notarization requirements.' : 'Draft for Review — no complaint is automatically submitted. No legal provisions, authorities or case numbers are inferred.'}</span>
        </div>
        <div class="card padded">
          <div class="wizard-top">
            ${['Select concerns', 'Factual summary', 'Edit draft', 'Review & export'].map((s, i) => `
              <span class="${model.step === i + 1 ? 'active' : model.step > i + 1 ? 'complete' : ''}">${i + 1}. ${s}</span>
            `).join('')}
          </div>
          ${model.step === 1 ? `
            <h3 style="font-size:15px;margin-bottom:6px">Choose what to include</h3>
            <p class="note-text" style="margin-bottom:14px">Sample findings are illustrative, not verified allegations. Documents for this case are included in the draft checklist.</p>
            ${findings().length ? findings().map(f => `
              <label class="check">
                <input type="checkbox" onchange="toggleDraftFinding('${type}','${f.id}',this.checked)" ${model.selected.includes(f.id) ? 'checked' : ''}>
                ${esc(f.name)} <span class="source-pill">${f.id} · ${f.doc}, p.${f.page}</span>
              </label>
            `).join('') : '<p class="note-text">No audit findings. A blank factual template can still be prepared.</p>'}
            <label for="draft-account" style="margin-top:20px">Your factual account (optional)</label>
            <textarea id="draft-account" placeholder="Only describe facts you can support. Avoid patient identifiers in this prototype." oninput="drafts[draftKey('${type}')].account=this.value">${esc(model.account || '')}</textarea>
          ` : model.step === 2 ? `
            <h3 style="font-size:15px;margin-bottom:6px">Check the factual summary</h3>
            <p class="note-text"><strong>Case:</strong> ${esc(current().name)} · ${esc(current().id)}</p>
            <p class="note-text"><strong>Provider:</strong> ${esc(current().hospital)}</p>
            <p class="note-text"><strong>Bill date:</strong> ${date(current().date)} · <strong>Amount:</strong> ${money(current().amount)}</p>
            <p class="note-text"><strong>User-provided account:</strong> ${esc(model.account || 'Not supplied. Placeholder will be included.')}</p>
            ${model.selected.map(id => {
              let f = findings().find(f => f.id === id);
              return f ? `<p class="note-text">${esc(f.name)} — ${esc(f.doc)}, page ${f.page} <span class="badge amber">Sample observation</span></p>` : '';
            }).join('')}
            <div class="notice" style="margin-top:16px">
              ${icon('info')}
              <span>Draft generation here uses a local template, not an AI model. Every unresolved concern is phrased as a request for clarification.</span>
            </div>
          ` : model.step === 3 ? `
            <div class="row" style="justify-content:space-between;margin-bottom:12px">
              <h3 style="font-size:15px">Draft for Review</h3>
              <span class="badge gray">Local template · ${demo ? 'Demo Data' : 'Not legal advice'}</span>
            </div>
            <label class="sr-only" for="draft-editor">Editable draft</label>
            <textarea class="draft" id="draft-editor" oninput="drafts[draftKey('${type}')].text=this.value">${esc(model.text)}</textarea>
            <p class="inline-note">Edits are kept in this tab. No external AI service has been used.</p>
          ` : `
            <h3 style="font-size:15px;margin-bottom:12px">Final review checklist</h3>
            ${[
              'I checked every factual statement against the original documents.',
              'I understand unresolved flags are not proven errors.',
              'I will verify the recipient, procedure and any execution requirements independently.',
              'I understand this is an unsigned draft and is not automatically submitted.'
            ].map(t => `<label class="check"><input type="checkbox" class="final-check">${t}</label>`).join('')}
            <pre style="white-space:pre-wrap;font:12px/1.8 Georgia,serif;background:#f8fafc;padding:20px;border:1px solid var(--line);border-radius:var(--radius-md);max-height:360px;overflow:auto;margin:16px 0">${esc(model.text)}</pre>
            <div class="actions">
              ${btn('Export draft (.txt)', `exportDraft('${type}')`, 'primary', 'download')}
              ${btn('Print / Save as PDF', `printDraft('${type}')`, '', 'file')}
            </div>
            <p class="inline-note">Print opens the browser print dialog; PDF availability depends on your browser.</p>
          `}
          <div class="actions" style="justify-content:space-between;margin-top:24px">
            ${model.step > 1 ? btn('Back', `drafts[draftKey('${type}')].step--;render()`) : '<span></span>'}
            ${model.step < 4 ? btn(model.step === 2 ? 'Prepare local template' : 'Continue', `advanceDraft('${type}')`, 'primary', 'arrow') : btn('Reports & Exports', "go('reports')")}
          </div>
        </div>
      `;
    }

    function toggleDraftFinding(type, id, on) {
      let m = drafts[draftKey(type)];
      m.selected = on ? [...new Set([...m.selected, id])] : m.selected.filter(x => x !== id);
    }

    function advanceDraft(type) {
      let m = drafts[draftKey(type)];
      if (m.step === 2 && !m.text) m.text = makeDraft(type, m);
      m.step++;
      render();
    }

    function makeDraft(type, m) {
      let c = current(), fs = findings().filter(f => m.selected.includes(f.id));
      return `${demo ? 'DEMO DATA — NOT A REAL PATIENT RECORD\n' : ''}DRAFT FOR REVIEW — ${type === 'affidavit' ? 'FACTUAL AFFIDAVIT TEMPLATE' : 'BILLING CLARIFICATION / COMPLAINT TEMPLATE'}
Local template; no AI model or legal validation was used.

Case reference: ${c.id}
Prepared: ${new Date().toLocaleDateString('en-GB')}

To: [Recipient / appropriate authority — verify before use]
From: [Complainant name, address and contact details]
Provider: ${c.hospital}

1. The case information supplied records a bill dated ${date(c.date)} with a total of ${money(c.amount)}. These details require confirmation against the original.

2. User-provided chronology / factual account:
${m.account || '[Insert a dated factual account, with a source reference for each statement.]'}

3. Questions for clarification:
${fs.length ? fs.map((f, i) => `3.${i + 1} Please clarify: ${f.name}. ${f.why} Source: ${f.doc}, page ${f.page}. ${demo ? 'This is a fictional sample observation.' : ''}`).join('\n\n') : '[Insert specific concerns and the supporting document/page references.]'}

4. Supporting document checklist:
${docs().map(d => `- ${d.id}: ${d.name} (${d.confirmed ? 'reviewed locally' : 'not confirmed'}${d.sample ? '; synthetic sample' : ''}).`).join('\n') || '[No supporting documents added.]'}

5. Requested resolution:
[Specify the clarification, itemized explanation, correction or other resolution requested without assuming wrongdoing.]

6. Unresolved questions:
[Confirm the facts, applicability of any pricing references and missing records.]

${type === 'affidavit' ? `7. Verification placeholder:
[Verify the appropriate wording and execution requirements with qualified legal guidance.]

This is an AI-assisted draft, not a sworn or legally validated affidavit. Review it carefully and obtain appropriate legal guidance about execution, attestation, or notarization requirements.\n\n` : ''}Place: [Place]
Date: [Date]
Signature: [To be signed only after review]

This is an unsigned draft, not a filed complaint, sworn statement, legal opinion or verified finding of overcharging. No automatic submission has occurred.`;
    }

    function checkedFinal() {
      if ([...document.querySelectorAll('.final-check')].some(c => !c.checked)) {
        toast('Complete each final review item before exporting.');
        return false;
      }
      return true;
    }

    function exportDraft(type) {
      if (!checkedFinal()) return;
      download(`${current().id}-${type}-draft.txt`, drafts[draftKey(type)].text);
      toast('Draft exported as plain text. Nothing has been submitted.');
    }

    function printDraft(type) {
      if (!checkedFinal()) return;
      printText(drafts[draftKey(type)].text);
    }

    function printText(text) {
      let f = document.createElement('iframe');
      f.style = 'position:fixed;left:-10000px;width:800px;height:600px';
      document.body.appendChild(f);
      f.contentDocument.open();
      f.contentDocument.write('<!doctype html><html><head><title>Bill Saathi · Draft for Review</title><style>body{font:13px/1.8 Georgia,serif;padding:35px;color:#0f172a}pre{white-space:pre-wrap;font:inherit}</style></head><body><pre>' + esc(text) + '</pre></body></html>');
      f.contentDocument.close();
      f.contentWindow.focus();
      f.contentWindow.print();
      setTimeout(() => f.remove(), 60000);
    }

    function download(name, text, type = 'text/plain') {
      let blob = new Blob([text], { type });
      let u = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = u;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }

    function reportText(key) {

      return `${demo ? 'DEMO DATA — NOT A REAL PATIENT RECORD\n' : ''}BILL SAATHI AI — ${key.toUpperCase()} REPORT
Case: ${c.id} / ${c.name}
Date: ${new Date().toLocaleDateString('en-GB')}

Review status: ${c.stage}
