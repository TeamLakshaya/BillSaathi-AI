DOCUMENTS & REVIEW STATUS
${docs().map(d => `${d.id}: ${d.name}; ${d.status}; source page ${d.sample ? '1' : 'not supplied'}`).join('\n') || 'No documents supplied.'}

${key !== 'checklist' ? 'FINDINGS / SOURCE REFERENCES\n' + (findings().map(f => `${f.id}: ${f.name}\n${f.why}\nSource ${f.doc}, page ${f.page}; ${f.status}${f.note ? '\nUser review note: ' + f.note : ''}`).join('\n\n') || 'No audit findings; no connected audit service.') + '\n\n' : ''}USER NOTES
${state().notes[c.id] || 'None recorded.'}

UNRESOLVED QUESTIONS
${findings().filter(f => f.status !== 'Resolved by User').map(f => f.id + ': ' + f.name).join('\n') || 'No recorded unresolved findings. This does not establish the absence of billing issues.'}

DOCUMENT CHECKLIST
${categories.map(cat => `${docs().some(d => d.category === cat) ? '[Selected]' : '[Not supplied]'} ${cat}`).join('\n')}

DISCLAIMER
Sample findings are illustrative, not actual AI audit outputs. No independent source verification or official pricing check has been completed. User review is not proof of validity. No confirmed fraud, recovery or overcharging is asserted. This is not medical or legal advice.`;
    }

    function reviewReport(key) {
      if (['complaint', 'affidavit'].includes(key)) {
        go(key);
        let m = drafts[draftKey(key)];
        m.step = m.text ? 4 : 1;
        render();
        return;
      }
      let text = reportText(key);
      window.lastReport = { key, text };
      modal('Review report before export', `
        <p class="note-text">Check every source reference and unresolved question. ${demo ? 'This report contains fictional sample records.' : ''}</p>
        <pre style="white-space:pre-wrap;max-height:390px;overflow:auto;font:11px/1.8 ui-monospace,monospace;background:#f8fafc;padding:14px;border:1px solid var(--line);border-radius:var(--radius-md);margin-top:12px">${esc(text)}</pre>
      `, btn('Print / Save PDF', 'printText(window.lastReport.text)') + btn('Export .txt', "download(current().id+'-'+window.lastReport.key+'.txt',window.lastReport.text)", 'primary', 'download'));
    }

    /* ==========================================================================
       HELP & GUIDANCE VIEW
       ========================================================================== */
    function helpPage() {
      return `
        ${heading('A little guidance, every step of the way', 'Medical billing can feel complex. Start with one document and one question.')}
        <div class="card padded" style="margin-bottom:20px">
          <div class="eyebrow">HOW BILL SAATHI AI WORKS</div>
          <h3 style="font-size:18px;margin-top:6px;font-weight:750">From a confusing bill to an informed next step.</h3>
          <div class="help-steps" style="margin-top:16px">
            ${['Create a case', 'Add your documents', 'Review extracted details', 'Inspect the bill audit', 'Verify relevant references', 'Organize your evidence', 'Prepare an optional draft', 'Review and export'].map(t => `<div>${t}</div>`).join('')}
          </div>
        </div>
        <div class="two-col">
          <section class="card padded">
            <h3 style="font-size:15px;margin-top:0;font-weight:700">Billing terms, in plain language</h3>
            ${[
              ['Itemized bill', 'A bill that lists individual services, medicines and charges.'],
              ['Potential duplicate', 'Two entries that may refer to the same charge and need review. Similar descriptions do not establish that a charge is invalid.'],
              ['Reference price', 'A documented price that may apply to a particular service or situation. Check the effective date and applicability.'],
              ['Evidence', 'Documents or information supporting a statement.'],
              ['Complaint draft', 'A document prepared for your review before submission. A draft is not a filed complaint.']
            ].map(([t, d]) => `<details><summary>${t}</summary><p>${d}</p></details>`).join('')}
          </section>
          <section class="card padded">
            <h3 style="font-size:15px;margin-top:0;font-weight:700">What is available in this prototype?</h3>
            <p class="note-text">You can create cases locally, select and preview files, edit information, explore sample findings, link evidence, prepare templates, and export text reports.</p>
            <p class="note-text">Cloud storage, authentication, OCR, automated AI audits, verified price lookup, notifications by email and online complaint submission are not connected.</p>
            <div class="notice warning">
              ${icon('warning')}
              <span>Do not use this prototype as a secure medical-record system. Files and case information are cleared on reload. Use fictional data when demonstrating it.</span>
            </div>
            ${btn('View integration requirements', "integrationInfo()", '', 'file')}
          </section>
        </div>
      `;
    }

    function integrationInfo() {
      modal('Backend integration requirements', `
        <p>A production deployment needs authenticated APIs, authorization, secure document storage, OCR, audit orchestration and verified reference lookup.</p>
        <div class="notice" style="margin:12px 0">
          <strong>Proposed integration endpoints</strong><br>
          <pre style="font-size:11px;white-space:pre-wrap;margin-top:6px">GET/POST /api/cases
PATCH/DELETE /api/cases/:id
POST /api/cases/:id/documents
GET/PATCH /api/documents/:id
POST /api/documents/:id/reprocess
POST /api/cases/:id/audits
GET /api/cases/:id/price-references
GET/POST /api/cases/:id/evidence
POST /api/cases/:id/drafts
GET /api/cases/:id/reports</pre>
        </div>
        <p class="note-text">The source bundle includes a proposed typed client and integration notes. No existing backend was supplied.</p>
      `);
    }

    /* ==========================================================================
       SETTINGS & PRIVACY VIEW
       ========================================================================== */
    let prefs = { name: '', contact: '', language: 'English', notifications: true };

    function settingsPage() {
      return `
        ${heading('Settings & privacy', 'You should always know what is stored, and where.')}
        <div class="two-col">
          <section class="card padded">
            <h3 style="margin-top:0;font-size:15px;font-weight:700">Workspace preferences</h3>
            <form onsubmit="event.preventDefault();saveSettings(this)">
              <div class="form-grid">
                <div>
                  <label for="pref-name">Display name</label>
                  <input name="name" id="pref-name" value="${esc(prefs.name)}" placeholder="Optional">
                </div>
                <div>
                  <label for="pref-contact">Contact information</label>
                  <input type="email" name="contact" id="pref-contact" value="${esc(prefs.contact)}" placeholder="Optional · not used to send email">
                </div>
                <div class="wide">
                  <label for="pref-lang">Language preference</label>
                  <select name="language" id="pref-lang">
                    <option>English</option>
                    <option disabled>Hindi · translation not implemented</option>
                  </select>
                </div>
                <div class="wide">
                  <label class="check">
                    <input type="checkbox" name="notifications" ${prefs.notifications ? 'checked' : ''}>
                    Show in-app case reminders
                  </label>
                </div>
              </div>
              <button class="primary" type="submit" style="margin-top:16px">Save session preferences</button>
              <p class="inline-note">Preferences are session-only. No profile server or email delivery is connected.</p>
            </form>
          </section>
          <section class="card padded">
            <h3 style="margin-top:0;font-size:15px;font-weight:700">Privacy & account security</h3>
            <p class="note-text">No account is signed in. Authentication, role-based access and encrypted server storage have not been implemented.</p>
            <p class="note-text">Selected files are held as temporary browser object URLs. No medical data is written to localStorage or sent by this application to a server. Closing or reloading the tab clears it.</p>
            <div class="actions" style="margin-top:16px">
              ${btn('Account security', "unavailable('Account security','GET /api/account/security')")}
              ${btn('Export session data', 'exportSession()', '', 'download')}
              ${btn('Clear workspace', 'clearWorkspace()', 'danger', 'trash')}
            </div>
            <p class="inline-note">Export includes case metadata, findings and notes, but not document binaries. Treat exported data as sensitive.</p>
          </section>
        </div>
        <div class="space"></div>
        <div class="notice warning">
          ${icon('warning')}
          <span>Production use requires security and privacy review, consent handling, access controls, retention policies and backend integration. This is a frontend prototype, not a secure patient-record service.</span>
        </div>
      `;
    }

    function saveSettings(form) {
      let f = new FormData(form);
      prefs = { ...Object.fromEntries(f), notifications: f.has('notifications') };
      toast('Preferences saved in this tab only.');
    }

    function exportSession() {
      download(`bill-saathi-${demo ? 'demo' : 'local'}-session.json`, JSON.stringify({
        mode: demo ? 'demo' : 'local',
        exportedAt: new Date().toISOString(),
        data: state(),
        drafts: Object.fromEntries(Object.entries(drafts).filter(([k]) => k.startsWith(demo ? 'demo:' : 'local:')))
      }, null, 2), 'application/json');
    }

    function clearWorkspace() {
      modal('Clear this workspace?', `
        <p>This clears cases, findings, notes, local files and drafts for the current ${demo ? 'demo' : 'local'} workspace. It does not delete exported copies or server data.</p>
      `, btn('Clear workspace', "doClear()", 'danger'));
    }

    function doClear() {
      let s = state();
      s.docs.forEach(d => {
        if (docUrls.has(d.id)) {
          URL.revokeObjectURL(docUrls.get(d.id));
          docUrls.delete(d.id);
        }
        delete ocrEdits[d.id];
      });
      for (let k of Object.keys(drafts)) {
        if (k.startsWith(demo ? 'demo:' : 'local:')) delete drafts[k];
      }
      Object.assign(s, { cases: [], docs: [], findings: [], notes: {}, activity: [] });
      pending = [];
      document.getElementById('dialog').close();
      go('overview');
      toast('Workspace cleared from this tab.');
    }

    /* Event Listeners */
    window.addEventListener('hashchange', () => {
      let r = location.hash.slice(1);
      if (r && r !== route) {
        route = r;
        render();
      }
    });

    document.getElementById('dialog').addEventListener('click', e => {
      if (e.target === e.currentTarget) {
        let b = e.currentTarget.getBoundingClientRect();
        if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) {
          e.currentTarget.close();
        }
      }
    });

    window.addEventListener('beforeunload', () => docUrls.forEach(u => URL.revokeObjectURL(u)));

    /* Initial Load */
    route = location.hash.slice(1) || 'overview';
    render();
  </script>
</body>
</html>
