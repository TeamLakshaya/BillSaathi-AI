[project]
name = "billsaathi-backend"
version = "1.0.0"
description = "AI-Powered Medical Bill Verification Platform for India"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-multipart>=0.0.12",
    "pypdf>=4.3.0",
    "reportlab>=4.2.0",
    "pyjwt[crypto]>=2.9.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "uploads",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
