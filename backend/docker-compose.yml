version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: billsaathi_postgres
    restart: always
    environment:
      POSTGRES_USER: billsaathi_user
      POSTGRES_PASSWORD: billsaathi_secure_password
      POSTGRES_DB: billsaathi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: billsaathi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://billsaathi_user:billsaathi_secure_password@db:5432/billsaathi_db
      DEMO_MODE: "true"
      SECRET_KEY: "production-ready-super-secret-key-replace-me"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

volumes:
  postgres_data:
